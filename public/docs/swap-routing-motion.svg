<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="swap-title swap-desc">
  <title id="swap-title">Nexio Swap Execution Pipeline and Guardrails</title>
  <desc id="swap-desc">Pure spot and DailyGM tier-discounted quote, dynamic spender exact allowance with 1-block confirmation, 5 percent price-impact and minAmountOut guard, and atomic settlement on Arc Mainnet 5042.</desc>
  <defs>
    <linearGradient id="bg-swap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a" />
      <stop offset="100%" stop-color="#071b2a" />
    </linearGradient>
    <linearGradient id="swap-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="grid-swap" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <clipPath id="clip-swap">
      <rect x="0" y="0" width="920" height="300" rx="20" />
    </clipPath>
  </defs>
  <style>
    .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
    @keyframes beam-run { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
    .s-beam { stroke-dasharray: 8 10; animation: beam-run 1.1s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .s-beam { animation: none !important; }
    }
  </style>

  <g clip-path="url(#clip-swap)">
    <rect width="920" height="300" fill="url(#bg-swap)" />
    <rect width="920" height="300" fill="url(#grid-swap)" />

    <text x="32" y="34" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1.6" class="f-sans">NEXIO SWAP EXECUTION PIPELINE &amp; SAFETY GATES</text>
    <rect x="662" y="18" width="226" height="22" rx="11" fill="#072235" stroke="#0284c7" />
    <text x="775" y="33" text-anchor="middle" fill="#7dd3fc" font-size="9.5" font-weight="800" class="f-mono">FEES: 20 &#183; 10 &#183; 5 &#183; 0 BPS VIP</text>

    <!-- Step 1 -->
    <rect x="28" y="74" width="194" height="162" rx="14" fill="#081629" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="44" y="100" fill="#7dd3fc" font-size="10" font-weight="800" class="f-mono">STEP 01 &#183; QUOTE</text>
    <text x="44" y="120" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Spot &amp; Tier Route</text>
    <text x="44" y="142" fill="#cbd5e1" font-size="10" class="f-sans">1-Unit Pure Market Spot</text>
    <text x="44" y="160" fill="#94a3b8" font-size="9.5" class="f-mono">(feeBps = 0 benchmark)</text>
    <rect x="44" y="176" width="162" height="44" rx="8" fill="#050d1a" stroke="#1e293b" />
    <text x="54" y="194" fill="#bae6fd" font-size="9.5" font-weight="700" class="f-mono">15s Freshness Ring</text>
    <text x="54" y="210" fill="#94a3b8" font-size="9" class="f-mono">Wallet + Streak Keyed</text>

    <!-- Step 2 -->
    <rect x="252" y="74" width="194" height="162" rx="14" fill="#08182d" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="268" y="100" fill="#fde68a" font-size="10" font-weight="800" class="f-mono">STEP 02 &#183; ALLOWANCE</text>
    <text x="268" y="120" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Dynamic Spender</text>
    <text x="268" y="142" fill="#cbd5e1" font-size="10" class="f-sans">Exact Amount Approval</text>
    <text x="268" y="160" fill="#94a3b8" font-size="9.5" class="f-mono">approval.spender verified</text>
    <rect x="268" y="176" width="162" height="44" rx="8" fill="#050d1a" stroke="#1e293b" />
    <text x="278" y="194" fill="#fcd34d" font-size="9.5" font-weight="700" class="f-mono">approveTx.wait(1)</text>
    <text x="278" y="210" fill="#94a3b8" font-size="9" class="f-mono">+ RPC Allowance Poll</text>

    <!-- Step 3 -->
    <rect x="476" y="74" width="194" height="162" rx="14" fill="#081b2c" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.3" />
    <text x="492" y="100" fill="#7dd3fc" font-size="10" font-weight="800" class="f-mono">STEP 03 &#183; GUARDRAILS</text>
    <text x="492" y="120" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Simulation &amp; Floor</text>
    <text x="492" y="142" fill="#cbd5e1" font-size="10" class="f-sans">Impact &#8804; 5.0% &#183; Loss &#8804; 20%</text>
    <text x="492" y="160" fill="#94a3b8" font-size="9.5" class="f-mono">minAmountOut enforced</text>
    <rect x="492" y="176" width="162" height="44" rx="8" fill="#050d1a" stroke="#1e293b" />
    <text x="502" y="194" fill="#6ee7b7" font-size="9.5" font-weight="700" class="f-mono">eth_call + estimateGas</text>
    <text x="502" y="210" fill="#94a3b8" font-size="9" class="f-mono">Pre-Sign Revert Check</text>

    <!-- Step 4 -->
    <rect x="700" y="74" width="192" height="162" rx="14" fill="#06221d" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.4" />
    <text x="716" y="100" fill="#6ee7b7" font-size="10" font-weight="800" class="f-mono">STEP 04 &#183; FINALITY</text>
    <text x="716" y="120" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Atomic Settlement</text>
    <text x="716" y="142" fill="#d1fae5" font-size="10.5" font-weight="700" class="f-mono">USDC &#8644; EURC (6-dec)</text>
    <text x="716" y="160" fill="#94a3b8" font-size="9.5" class="f-mono">0.005 USDC Gas Kept</text>
    <rect x="716" y="176" width="160" height="44" rx="8" fill="#041512" stroke="#059669" stroke-opacity="0.55" />
    <text x="726" y="194" fill="#6ee7b7" font-size="9.5" font-weight="800" class="f-mono">&#10003; Confirmed Block +1</text>
    <text x="726" y="210" fill="#a7f3d0" font-size="9" class="f-mono">Explorer Receipt Drawer</text>

    <!-- Animated Conduit Beams -->
    <line x1="222" y1="155" x2="252" y2="155" stroke="url(#swap-beam)" stroke-width="2.5" class="s-beam" />
    <line x1="446" y1="155" x2="476" y2="155" stroke="url(#swap-beam)" stroke-width="2.5" class="s-beam" />
    <line x1="670" y1="155" x2="700" y2="155" stroke="url(#swap-beam)" stroke-width="2.5" class="s-beam" />

    <circle r="4" fill="#38bdf8">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 222 155 L 700 155" />
    </circle>

    <text x="460" y="274" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="600" class="f-sans">Re-fetches fresh swap calldata after approval mining and halts if output slips below accepted minAmountOut</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="298.5" rx="19.25" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
