<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="lp-title lp-desc">
  <title id="lp-title">USDC/EURC Liquidity Pool and 5 Percent Reserve-Skew Guard</title>
  <desc id="lp-desc">Compares on-chain V2 USDC/EURC pool price against live 1-unit market spot: allows deposits within plus or minus 500 bps, pauses deposits above 500 bps or stale spot, and keeps liquidity withdrawals unconditionally open.</desc>
  <defs>
    <linearGradient id="bg-lp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a" />
      <stop offset="100%" stop-color="#071d29" />
    </linearGradient>
    <pattern id="grid-lp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <clipPath id="clip-lp">
      <rect x="0" y="0" width="920" height="300" rx="20" />
    </clipPath>
  </defs>
  <style>
    .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
    @keyframes lp-dash { to { stroke-dashoffset: -36; } }
    @keyframes pip-sway {
      0%, 100% { transform: translateX(-24px); }
      50% { transform: translateX(28px); }
    }
    .lp-flow { stroke-dasharray: 6 6; animation: lp-dash 1.3s linear infinite; }
    .skew-pip { animation: pip-sway 4.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .lp-flow, .skew-pip { animation: none !important; }
    }
  </style>

  <g clip-path="url(#clip-lp)">
    <rect width="920" height="300" fill="url(#bg-lp)" />
    <rect width="920" height="300" fill="url(#grid-lp)" />

    <text x="32" y="34" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1.6" class="f-sans">USDC / EURC V2 LIQUIDITY &amp; &#177;5.00% RESERVE-SKEW CIRCUIT BREAKER</text>
    <rect x="666" y="18" width="222" height="22" rx="11" fill="#062821" stroke="#10b981" />
    <text x="777" y="33" text-anchor="middle" fill="#6ee7b7" font-size="9.5" font-weight="800" class="f-mono">GUARD: &#177;500 BPS &#183; 45S SPOT TTL</text>

    <!-- Left Inputs -->
    <rect x="32" y="68" width="214" height="80" rx="12" fill="#081629" stroke="#38bdf8" stroke-opacity="0.55" />
    <text x="48" y="92" fill="#f8fafc" font-size="12" font-weight="800" class="f-sans">V2 Pool Reserves</text>
    <text x="48" y="111" fill="#7dd3fc" font-size="10" font-weight="700" class="f-mono">reserveUSDC / reserveEURC</text>
    <text x="48" y="129" fill="#94a3b8" font-size="9.5" class="f-mono">Implied EURC/USDC Ratio</text>

    <rect x="32" y="164" width="214" height="80" rx="12" fill="#071b24" stroke="#34d399" stroke-opacity="0.55" />
    <text x="48" y="188" fill="#f8fafc" font-size="12" font-weight="800" class="f-sans">Live Market Spot</text>
    <text x="48" y="207" fill="#6ee7b7" font-size="10" font-weight="700" class="f-mono">1.000000 EURC Pure Quote</text>
    <text x="48" y="225" fill="#94a3b8" font-size="9.5" class="f-mono">45s Staleness Eviction</text>

    <!-- Center Comparator -->
    <rect x="294" y="68" width="318" height="176" rx="14" fill="#08182d" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.4" />
    <text x="453" y="95" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Real-Time Skew Comparator</text>
    <text x="453" y="114" text-anchor="middle" fill="#94a3b8" font-size="10" class="f-mono">|poolPrice - spotPrice| / spotPrice &#8804; 500 bps</text>

    <!-- Deviation Bar: total width 276 (x=315..591) -->
    <rect x="315" y="142" width="46" height="14" rx="5" fill="#881337" fill-opacity="0.65" />
    <rect x="363" y="142" width="180" height="14" rx="3" fill="#065f46" fill-opacity="0.7" />
    <rect x="545" y="142" width="46" height="14" rx="5" fill="#881337" fill-opacity="0.65" />

    <!-- Ticks -->
    <line x1="363" y1="135" x2="363" y2="163" stroke="#fbbf24" stroke-width="2" />
    <line x1="453" y1="133" x2="453" y2="165" stroke="#e2e8f0" stroke-width="1.8" />
    <line x1="543" y1="135" x2="543" y2="163" stroke="#fbbf24" stroke-width="2" />

    <!-- Animated Pip inside Safe Zone -->
    <g class="skew-pip">
      <circle cx="453" cy="149" r="7" fill="#34d399" stroke="#060d1a" stroke-width="2" />
    </g>

    <text x="363" y="180" text-anchor="middle" fill="#fde68a" font-size="9.5" font-weight="800" class="f-mono">-5.0%</text>
    <text x="453" y="180" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-weight="800" class="f-mono">0.0% PARITY</text>
    <text x="543" y="180" text-anchor="middle" fill="#fde68a" font-size="9.5" font-weight="800" class="f-mono">+5.0%</text>

    <text x="453" y="210" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700" class="f-sans">Safe Zone: addLiquidity() Enabled</text>
    <text x="453" y="227" text-anchor="middle" fill="#fda4af" font-size="9.5" font-weight="700" class="f-sans">Outer Zones / Missing Spot: Deposits Paused</text>

    <!-- Right Dual Execution Paths -->
    <rect x="660" y="68" width="228" height="80" rx="12" fill="#081a2c" stroke="#fbbf24" stroke-opacity="0.55" />
    <text x="676" y="92" fill="#fde68a" font-size="11.5" font-weight="800" class="f-sans">Add Liquidity (Protected)</text>
    <text x="676" y="111" fill="#e2e8f0" font-size="9.5" class="f-mono">&#8804; 500 bps: Active (Incl. Empty)</text>
    <text x="676" y="129" fill="#fda4af" font-size="9.5" class="f-mono">&gt; 500 bps: Arbitrage-Blocked</text>

    <rect x="660" y="164" width="228" height="80" rx="12" fill="#06241e" stroke="#10b981" stroke-opacity="0.7" />
    <text x="676" y="188" fill="#6ee7b7" font-size="11.5" font-weight="800" class="f-sans">Remove Liquidity (Always Open)</text>
    <text x="676" y="207" fill="#ecfdf5" font-size="9.5" class="f-mono">removeLiquidity() Unconditional</text>
    <text x="676" y="225" fill="#a7f3d0" font-size="9.5" class="f-mono">24/7 LP Principal Exit Guaranteed</text>

    <!-- Connectors -->
    <line x1="246" y1="108" x2="294" y2="128" stroke="#38bdf8" stroke-width="2" class="lp-flow" />
    <line x1="246" y1="204" x2="294" y2="184" stroke="#34d399" stroke-width="2" class="lp-flow" />
    <line x1="612" y1="128" x2="660" y2="108" stroke="#fbbf24" stroke-width="2" class="lp-flow" />
    <line x1="612" y1="184" x2="660" y2="204" stroke="#34d399" stroke-width="2" class="lp-flow" />

    <text x="460" y="274" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="600" class="f-sans">Protects liquidity providers from off-market deposit loss while never restricting withdrawals</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="298.5" rx="19.25" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
