<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="gm-title gm-desc">
  <title id="gm-title">Consecutive Daily GM Protocol and 3 Unlockable Tiers</title>
  <desc id="gm-desc">24-hour check-in cooldown and 48-hour consecutive streak reset window progressing from 0-29 days unranked building into strictly 3 unlockable consecutive tiers: 30D Tier 1, 90D Tier 2, and 180D Tier 3 VIP.</desc>
  <defs>
    <linearGradient id="bg-gm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a" />
      <stop offset="60%" stop-color="#08182c" />
      <stop offset="100%" stop-color="#141624" />
    </linearGradient>
    <linearGradient id="tier-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid-gm" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <clipPath id="clip-gm">
      <rect x="0" y="0" width="920" height="300" rx="20" />
    </clipPath>
  </defs>
  <style>
    .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
    @keyframes gm-flow { to { stroke-dashoffset: -32; } }
    @keyframes cooldown-sweep { 0% { stroke-dashoffset: 226; } 50% { stroke-dashoffset: 35; } 100% { stroke-dashoffset: 226; } }
    .gm-rail { stroke-dasharray: 5 5; animation: gm-flow 1.3s linear infinite; }
    .cd-ring { stroke-dasharray: 226; animation: cooldown-sweep 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .gm-rail, .cd-ring { animation: none !important; stroke-dashoffset: 50; }
    }
  </style>

  <g clip-path="url(#clip-gm)">
    <rect width="920" height="300" fill="url(#bg-gm)" />
    <rect width="920" height="300" fill="url(#grid-gm)" />

    <text x="32" y="34" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1.6" class="f-sans">CONSECUTIVE DAILY GM PROTOCOL &#183; STRICTLY 3 UNLOCKABLE TIERS</text>
    <rect x="646" y="18" width="242" height="22" rx="11" fill="#1e1b18" stroke="#f59e0b" stroke-opacity="0.7" />
    <text x="767" y="33" text-anchor="middle" fill="#fde68a" font-size="9.5" font-weight="800" class="f-mono">24H COOLDOWN &#183; 48H RESET WINDOW</text>

    <!-- Left Radial Consecutive Clock Card -->
    <rect x="30" y="62" width="210" height="186" rx="14" fill="#081629" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3" />
    <g transform="translate(135, 134)">
      <!-- 3 Outer Consecutive Tier Arcs -->
      <path d="M 3.3 -47.9 A 48 48 0 0 1 39.8 26.8" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <path d="M 36.2 31.5 A 48 48 0 0 1 -36.2 31.5" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
      <path d="M -39.8 26.8 A 48 48 0 0 1 -3.3 -47.9" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
      <!-- Inner 24h Cooldown Ring -->
      <circle cx="0" cy="0" r="36" fill="none" stroke="#1e293b" stroke-width="3.5" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90)" class="cd-ring" />
      <text x="0" y="2" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="900" class="f-mono">checkIn</text>
      <text x="0" y="16" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-weight="700" class="f-mono">24h..48h</text>
    </g>
    <text x="135" y="206" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="800" class="f-mono">24h &#8804; &#916;t &#8804; 48h &#8594; streak + 1</text>
    <text x="135" y="224" text-anchor="middle" fill="#fda4af" font-size="9.5" font-weight="700" class="f-mono">&#916;t &gt; 48h &#8594; resets to Day 1</text>

    <!-- Unranked Entry Box -->
    <rect x="266" y="62" width="136" height="186" rx="14" fill="#071322" stroke="#475569" stroke-opacity="0.65" />
    <text x="280" y="88" fill="#94a3b8" font-size="9.5" font-weight="800" class="f-mono">UNRANKED</text>
    <text x="280" y="108" fill="#e2e8f0" font-size="13" font-weight="800" class="f-sans">0&#8211;29 Days</text>
    <text x="280" y="128" fill="#94a3b8" font-size="10" class="f-sans">Building Streak</text>
    <rect x="278" y="146" width="112" height="84" rx="8" fill="#040b14" stroke="#1e293b" />
    <text x="288" y="167" fill="#cbd5e1" font-size="9.5" font-weight="700" class="f-mono">Fee: 20 bps</text>
    <text x="288" y="186" fill="#cbd5e1" font-size="9.5" font-weight="700" class="f-mono">Batch: 5 max</text>
    <text x="288" y="206" fill="#7dd3fc" font-size="9" font-weight="700" class="f-mono">&#8594; Target: 30D</text>

    <!-- Tier 1: 30 Days -->
    <rect x="424" y="62" width="146" height="186" rx="14" fill="#081a2f" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.4" />
    <rect x="438" y="74" width="60" height="18" rx="9" fill="#0c2d48" />
    <text x="468" y="86" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="800" class="f-mono">TIER 1</text>
    <text x="438" y="112" fill="#f8fafc" font-size="14" font-weight="900" class="f-sans">30 Days</text>
    <text x="438" y="129" fill="#7dd3fc" font-size="9.5" font-weight="700" class="f-sans">Verified Sender</text>
    <rect x="438" y="146" width="118" height="84" rx="8" fill="#050e1b" stroke="#0284c7" stroke-opacity="0.45" />
    <text x="448" y="167" fill="#e0f2fe" font-size="10" font-weight="800" class="f-mono">10 bps (50% Off)</text>
    <text x="448" y="186" fill="#bae6fd" font-size="9.5" font-weight="700" class="f-mono">Batch: 20 addrs</text>
    <text x="448" y="206" fill="#94a3b8" font-size="9" class="f-sans">30&#8211;89 Consec. Days</text>

    <!-- Tier 2: 90 Days -->
    <rect x="592" y="62" width="146" height="186" rx="14" fill="#062124" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.4" />
    <rect x="606" y="74" width="60" height="18" rx="9" fill="#06372c" />
    <text x="636" y="86" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="800" class="f-mono">TIER 2</text>
    <text x="606" y="112" fill="#f8fafc" font-size="14" font-weight="900" class="f-sans">90 Days</text>
    <text x="606" y="129" fill="#6ee7b7" font-size="9.5" font-weight="700" class="f-sans">Priority Telemetry</text>
    <rect x="606" y="146" width="118" height="84" rx="8" fill="#041413" stroke="#059669" stroke-opacity="0.45" />
    <text x="616" y="167" fill="#d1fae5" font-size="10" font-weight="800" class="f-mono">5 bps (75% Off)</text>
    <text x="616" y="186" fill="#a7f3d0" font-size="9.5" font-weight="700" class="f-mono">Batch: 50 addrs</text>
    <text x="616" y="206" fill="#94a3b8" font-size="9" class="f-sans">90&#8211;179 Consec. Days</text>

    <!-- Tier 3: 180 Days VIP -->
    <rect x="760" y="62" width="132" height="186" rx="14" fill="#1c1810" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.5" />
    <rect x="774" y="74" width="76" height="18" rx="9" fill="#452709" />
    <text x="812" y="86" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="800" class="f-mono">TIER 3 VIP</text>
    <text x="774" y="112" fill="#ffffff" font-size="14" font-weight="900" class="f-sans">180 Days</text>
    <text x="774" y="129" fill="#fcd34d" font-size="9.5" font-weight="700" class="f-sans">Highest VIP Tier</text>
    <rect x="772" y="146" width="108" height="84" rx="8" fill="#120e08" stroke="#d97706" stroke-opacity="0.5" />
    <text x="780" y="167" fill="#fef3c7" font-size="10" font-weight="800" class="f-mono">0 bps (100% Off)</text>
    <text x="780" y="186" fill="#fde68a" font-size="9.5" font-weight="700" class="f-mono">Batch: Unlimited</text>
    <text x="780" y="206" fill="#cbd5e1" font-size="9" class="f-sans">180+ Consec. Days</text>

    <!-- Progression Links -->
    <line x1="240" y1="155" x2="266" y2="155" stroke="#64748b" stroke-width="2" class="gm-rail" />
    <line x1="402" y1="155" x2="424" y2="155" stroke="#38bdf8" stroke-width="2" class="gm-rail" />
    <line x1="570" y1="155" x2="592" y2="155" stroke="#34d399" stroke-width="2" class="gm-rail" />
    <line x1="738" y1="155" x2="760" y2="155" stroke="#fbbf24" stroke-width="2" class="gm-rail" />

    <text x="460" y="274" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="600" class="f-sans">getEffectiveStreak(wallet) enforces real-time 48-hour consecutive expiry on-chain and in server fee routing</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="298.5" rx="19.25" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
