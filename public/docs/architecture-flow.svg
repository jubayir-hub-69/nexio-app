<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Nexio Protocol System Architecture on Arc Mainnet (5042)</title>
  <desc id="arch-desc">Connected wallet with shared 18-decimal native and 6-decimal ERC-20 USDC routing reads through Multicall3 and quotes through the server routing proxy to Arc Mainnet 5042 smart contracts.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a" />
      <stop offset="55%" stop-color="#091529" />
      <stop offset="100%" stop-color="#061926" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="beam-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="beam-emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="920" height="300" rx="20" />
    </clipPath>
    <path id="path-read-in" d="M 248 126 C 288 126, 286 92, 326 92" />
    <path id="path-write-in" d="M 248 182 C 288 182, 286 212, 326 212" />
    <path id="path-read-out1" d="M 566 84 C 608 84, 608 66, 650 66" />
    <path id="path-read-out2" d="M 566 96 C 608 96, 608 126, 650 126" />
    <path id="path-write-out1" d="M 566 206 C 608 206, 608 186, 650 186" />
    <path id="path-write-out2" d="M 566 218 C 608 218, 608 246, 650 246" />
  </defs>
  <style>
    .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
    @keyframes dash-flow { to { stroke-dashoffset: -36; } }
    @keyframes node-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .flow-line { stroke-dasharray: 6 6; animation: dash-flow 1.4s linear infinite; }
    .pulse-dot { animation: node-pulse 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow-line, .pulse-dot { animation: none !important; }
    }
  </style>

  <g clip-path="url(#card-clip)">
    <rect width="920" height="300" fill="url(#bg-grad)" />
    <rect width="920" height="300" fill="url(#grid)" />

    <!-- Top Header Bar -->
    <text x="32" y="34" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1.6" class="f-sans">NEXIO PROTOCOL SYSTEM ARCHITECTURE</text>
    <rect x="730" y="18" width="158" height="22" rx="11" fill="#072336" stroke="#0284c7" stroke-width="1" />
    <circle cx="744" cy="29" r="3.5" fill="#34d399" class="pulse-dot" />
    <text x="814" y="33" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="800" class="f-mono">ARC MAINNET &#183; 5042</text>

    <!-- Connector Rails -->
    <use href="#path-read-in" fill="none" stroke="url(#beam-cyan)" stroke-width="2" class="flow-line" />
    <use href="#path-write-in" fill="none" stroke="url(#beam-emerald)" stroke-width="2" class="flow-line" />
    <use href="#path-read-out1" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.7" class="flow-line" />
    <use href="#path-read-out2" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.7" class="flow-line" />
    <use href="#path-write-out1" fill="none" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.7" class="flow-line" />
    <use href="#path-write-out2" fill="none" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.7" class="flow-line" />

    <!-- Animated Data Packets -->
    <circle r="4" fill="#38bdf8">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 248 126 C 288 126, 286 92, 326 92" />
    </circle>
    <circle r="4" fill="#34d399">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M 248 182 C 288 182, 286 212, 326 212" />
    </circle>
    <circle r="3.5" fill="#7dd3fc">
      <animateMotion dur="2.1s" begin="0.7s" repeatCount="indefinite" path="M 566 84 C 608 84, 608 66, 650 66" />
    </circle>
    <circle r="3.5" fill="#6ee7b7">
      <animateMotion dur="2.3s" begin="1.1s" repeatCount="indefinite" path="M 566 218 C 608 218, 608 246, 650 246" />
    </circle>

    <!-- LEFT NODE: Connected Wallet & Shared Dual-Decimal USDC -->
    <rect x="32" y="66" width="216" height="184" rx="14" fill="#081528" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.4" />
    <text x="48" y="92" fill="#f8fafc" font-size="13" font-weight="800" class="f-sans">Connected Wallet</text>
    <text x="48" y="109" fill="#94a3b8" font-size="10.5" font-weight="600" class="f-mono">Chain 5042 (0x13b2)</text>

    <rect x="46" y="122" width="188" height="58" rx="9" fill="#050d1a" stroke="#0284c7" stroke-opacity="0.5" />
    <text x="56" y="140" fill="#7dd3fc" font-size="10" font-weight="800" class="f-sans">SHARED UNIFIED USDC</text>
    <text x="56" y="156" fill="#e2e8f0" font-size="10" class="f-mono">Native Gas: 18 Decimals</text>
    <text x="56" y="171" fill="#94a3b8" font-size="9.5" class="f-mono">0x3600...0000: 6 Dec (&#215;10&#8315;&#185;&#178;)</text>

    <rect x="46" y="190" width="188" height="46" rx="9" fill="#051a17" stroke="#059669" stroke-opacity="0.5" />
    <text x="56" y="208" fill="#6ee7b7" font-size="10" font-weight="800" class="f-sans">EURC + SIGNER GUARD</text>
    <text x="56" y="224" fill="#cbd5e1" font-size="9.5" class="f-mono">6-Dec EURC &#183; eth_call Sim</text>

    <!-- CENTER TOP: Multicall3 Batched Read Engine -->
    <rect x="326" y="54" width="240" height="84" rx="14" fill="#08182e" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.4" />
    <rect x="478" y="65" width="76" height="18" rx="9" fill="#0c2d48" />
    <text x="516" y="77" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="800" class="f-mono">READ-ONLY</text>
    <text x="342" y="79" fill="#f8fafc" font-size="12.5" font-weight="800" class="f-sans">Multicall3 Engine</text>
    <text x="342" y="98" fill="#94a3b8" font-size="10" class="f-mono">0xcA11bde0...76CA11</text>
    <text x="342" y="116" fill="#bae6fd" font-size="10" font-weight="600" class="f-sans">1-Roundtrip Snapshot &#183; Multi-RPC</text>

    <!-- CENTER BOTTOM: Server Routing & Streak Proxy -->
    <rect x="326" y="168" width="240" height="86" rx="14" fill="#071d24" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.4" />
    <rect x="470" y="179" width="84" height="18" rx="9" fill="#06372c" />
    <text x="512" y="191" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="800" class="f-mono">SERVER API</text>
    <text x="342" y="193" fill="#f8fafc" font-size="12.5" font-weight="800" class="f-sans">Nexio Routing Proxy</text>
    <text x="342" y="212" fill="#94a3b8" font-size="10" class="f-mono">Pure Spot &#183; 20/10/5/0 bps</text>
    <text x="342" y="230" fill="#a7f3d0" font-size="10" font-weight="600" class="f-sans">60s Streak Cache &#183; Rate-Limited</text>

    <!-- RIGHT CLUSTER: Arc Mainnet 5042 Smart Contracts -->
    <rect x="650" y="46" width="238" height="44" rx="11" fill="#08172b" stroke="#38bdf8" stroke-opacity="0.45" />
    <text x="666" y="65" fill="#f8fafc" font-size="11.5" font-weight="800" class="f-sans">USDC &amp; EURC Yield Vaults</text>
    <text x="666" y="80" fill="#94a3b8" font-size="9.5" class="f-mono">1:1 Principal &#183; claimNLP() 1e18</text>

    <rect x="650" y="104" width="238" height="44" rx="11" fill="#08172b" stroke="#fbbf24" stroke-opacity="0.45" />
    <text x="666" y="123" fill="#f8fafc" font-size="11.5" font-weight="800" class="f-sans">Consecutive DailyGM</text>
    <text x="666" y="138" fill="#fde68a" font-size="9.5" class="f-mono">24h Cooldown &#183; 48h Reset &#183; 3 Tiers</text>

    <rect x="650" y="162" width="238" height="44" rx="11" fill="#08172b" stroke="#38bdf8" stroke-opacity="0.45" />
    <text x="666" y="181" fill="#f8fafc" font-size="11.5" font-weight="800" class="f-sans">Nex Name Service (.nex)</text>
    <text x="666" y="196" fill="#7dd3fc" font-size="9.5" class="f-mono">0xE3Fd...5Ed7 &#183; 1 Wallet = 1 Name</text>

    <rect x="650" y="220" width="238" height="46" rx="11" fill="#071f20" stroke="#34d399" stroke-opacity="0.5" />
    <text x="666" y="240" fill="#f8fafc" font-size="11.5" font-weight="800" class="f-sans">V2 Pool &amp; Executor Settlement</text>
    <text x="666" y="255" fill="#6ee7b7" font-size="9.5" class="f-mono">&#177;5% Skew Guard &#183; tx.wait(1) Finality</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="298.5" rx="19.25" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />
</svg>
