<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="batch-title batch-desc">
  <title id="batch-title">Dashboard Send and Multi-Recipient Batch Settlement</title>
  <desc id="batch-desc">0.005 USDC per-recipient gas reserve, forward and reverse .nex domain resolution, and EIP-5792 wallet batch or sequential verified transfers across up to 20, 50, or unlimited recipients.</desc>
  <defs>
    <linearGradient id="bg-batch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1a" />
      <stop offset="100%" stop-color="#081a2c" />
    </linearGradient>
    <pattern id="grid-batch" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
    <clipPath id="clip-batch">
      <rect x="0" y="0" width="920" height="300" rx="20" />
    </clipPath>
  </defs>
  <style>
    .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
    @keyframes rail-move { to { stroke-dashoffset: -32; } }
    @keyframes badge-glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .flow-dash { stroke-dasharray: 5 5; animation: rail-move 1.2s linear infinite; }
    .glow-pill { animation: badge-glow 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow-dash, .glow-pill { animation: none !important; }
    }
  </style>

  <g clip-path="url(#clip-batch)">
    <rect width="920" height="300" fill="url(#bg-batch)" />
    <rect width="920" height="300" fill="url(#grid-batch)" />

    <text x="32" y="34" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1.6" class="f-sans">DASHBOARD SEND &amp; MULTI-RECIPIENT BATCH SETTLEMENT</text>
    <rect x="668" y="18" width="220" height="22" rx="11" fill="#072235" stroke="#0284c7" />
    <text x="778" y="33" text-anchor="middle" fill="#7dd3fc" font-size="9.5" font-weight="800" class="f-mono">CAPS: 5 &#183; 20 (T1) &#183; 50 (T2) &#183; &#8734; (T3)</text>

    <!-- Stage 1: Input & Gas Buffer -->
    <rect x="30" y="72" width="186" height="166" rx="14" fill="#081629" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="46" y="98" fill="#f8fafc" font-size="12.5" font-weight="800" class="f-sans">1. Pre-Flight Guard</text>
    <rect x="44" y="112" width="158" height="48" rx="8" fill="#050d1a" stroke="#1e293b" />
    <text x="54" y="130" fill="#7dd3fc" font-size="10" font-weight="800" class="f-mono">0.005 &#215; N USDC</text>
    <text x="54" y="146" fill="#94a3b8" font-size="9.5" class="f-sans">Native Gas Buffer Reserved</text>
    <rect x="44" y="170" width="158" height="52" rx="8" fill="#050d1a" stroke="#1e293b" />
    <text x="54" y="188" fill="#6ee7b7" font-size="10" font-weight="800" class="f-mono">Strict Decimal Parse</text>
    <text x="54" y="205" fill="#94a3b8" font-size="9.5" class="f-sans">18-dec Native / 6-dec ERC20</text>

    <!-- Stage 2: .nex Batch Resolver -->
    <rect x="256" y="72" width="200" height="166" rx="14" fill="#08182e" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.3" />
    <text x="272" y="98" fill="#f8fafc" font-size="12.5" font-weight="800" class="f-sans">2. .nex ANS Resolver</text>
    <rect x="270" y="112" width="172" height="50" rx="8" fill="#050d1a" stroke="#0284c7" stroke-opacity="0.45" />
    <text x="280" y="130" fill="#bae6fd" font-size="10" font-weight="700" class="f-mono">!isAvailable(name)</text>
    <text x="280" y="147" fill="#94a3b8" font-size="9.5" class="f-mono">&#8594; resolve("alice")</text>
    <rect x="270" y="172" width="172" height="50" rx="8" fill="#050d1a" stroke="#059669" stroke-opacity="0.45" />
    <text x="280" y="190" fill="#a7f3d0" font-size="10" font-weight="700" class="f-mono">hasDomain(0xAddr)</text>
    <text x="280" y="207" fill="#94a3b8" font-size="9.5" class="f-mono">&#8594; resolveByAddress()</text>

    <!-- Stage 3: EIP-5792 / Sequential Engine -->
    <rect x="496" y="72" width="190" height="166" rx="14" fill="#071e26" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.3" />
    <text x="512" y="98" fill="#f8fafc" font-size="12.5" font-weight="800" class="f-sans">3. Dispatch Engine</text>
    <rect x="510" y="112" width="162" height="52" rx="8" fill="#04131a" stroke="#0284c7" stroke-opacity="0.5" />
    <text x="520" y="130" fill="#7dd3fc" font-size="10" font-weight="800" class="f-mono">wallet_sendCalls</text>
    <text x="520" y="147" fill="#94a3b8" font-size="9.5" class="f-sans">EIP-5792 Atomic Batch</text>
    <rect x="510" y="172" width="162" height="52" rx="8" fill="#041512" stroke="#059669" stroke-opacity="0.5" />
    <text x="520" y="190" fill="#6ee7b7" font-size="10" font-weight="800" class="f-mono">Sequential Fallback</text>
    <text x="520" y="207" fill="#94a3b8" font-size="9.5" class="f-sans">tx.wait(1) + Retry Failed</text>

    <!-- Connecting Arrows -->
    <line x1="216" y1="155" x2="256" y2="155" stroke="#38bdf8" stroke-width="2" class="flow-dash" />
    <line x1="456" y1="155" x2="496" y2="155" stroke="#34d399" stroke-width="2" class="flow-dash" />

    <!-- Fan-out Rails to Recipients -->
    <path d="M 686 125 C 712 125, 712 88, 738 88" fill="none" stroke="#34d399" stroke-width="1.8" class="flow-dash" />
    <path d="M 686 155 L 738 155" fill="none" stroke="#34d399" stroke-width="1.8" class="flow-dash" />
    <path d="M 686 185 C 712 185, 712 222, 738 222" fill="none" stroke="#34d399" stroke-width="1.8" class="flow-dash" />

    <circle r="3.5" fill="#38bdf8">
      <animateMotion dur="1.6s" repeatCount="indefinite" path="M 216 155 L 256 155" />
    </circle>
    <circle r="3.5" fill="#34d399">
      <animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite" path="M 686 125 C 712 125, 712 88, 738 88" />
    </circle>
    <circle r="3.5" fill="#34d399">
      <animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M 686 155 L 738 155" />
    </circle>
    <circle r="3.5" fill="#34d399">
      <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 686 185 C 712 185, 712 222, 738 222" />
    </circle>

    <!-- Right Recipient Slots -->
    <rect x="738" y="66" width="152" height="44" rx="10" fill="#06211d" stroke="#10b981" stroke-opacity="0.6" />
    <text x="752" y="85" fill="#ecfdf5" font-size="11" font-weight="800" class="f-mono">treasury.nex</text>
    <text x="752" y="100" fill="#6ee7b7" font-size="9.5" font-weight="700" class="f-mono">&#10003; Settled &#183; Block +1</text>

    <rect x="738" y="133" width="152" height="44" rx="10" fill="#06211d" stroke="#10b981" stroke-opacity="0.6" />
    <text x="752" y="152" fill="#ecfdf5" font-size="11" font-weight="800" class="f-mono">0x8B3a...91cE</text>
    <text x="752" y="167" fill="#6ee7b7" font-size="9.5" font-weight="700" class="f-mono">&#10003; Settled &#183; EOA Memo</text>

    <rect x="738" y="200" width="152" height="44" rx="10" fill="#06211d" stroke="#10b981" stroke-opacity="0.6" class="glow-pill" />
    <text x="752" y="219" fill="#ecfdf5" font-size="11" font-weight="800" class="f-mono">ops-vault.nex</text>
    <text x="752" y="234" fill="#6ee7b7" font-size="9.5" font-weight="700" class="f-mono">&#10003; Settled &#183; Verified</text>

    <text x="460" y="274" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="600" class="f-sans">Zero Multicall3 token-transfer reverts &#8212; direct wallet-authorized settlement per recipient</text>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="298.5" rx="19.25" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
